[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releaseproof"
version = "0.1.0"
description = "Evidence-led autonomous release verification agent built on the Strands Agents SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ajat"}]
keywords = [
    "strands",
    "strands-agents",
    "ai-agent",
    "release-verification",
    "autonomous-agent",
    "evidence-led",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "strands-agents>=0.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
agentcore = ["bedrock-agentcore>=0.1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
releaseproof = "releaseproof.cli:main"

[project.urls]
Homepage = "https://github.com/ajat/releaseproof"
Repository = "https://github.com/ajat/releaseproof"

[tool.hatch.build.targets.wheel]
packages = ["src/releaseproof"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
